<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <title>登入｜蛋糕調查實驗</title>
  <meta content="Chernyh Mihail" name="author">
  <meta content="GetRider" name="description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="HandheldFriendly" content="true">
  <meta name="format-detection" content="telephone=no">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <link rel="stylesheet" href="assets/css/uikit.min.css">
  <link rel="stylesheet" href="assets/css/all.min.css">
  <link rel="stylesheet" href="assets/css/datepicker.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
<style>.page-wrapper{overflow:visible}.section-banner{background:#edf0f2;padding:16px 0}.section-banner__bg{display:none}.section-banner__title span,.section-banner__title h3{color:#22282c}.uk-button-danger{color:#26221b}.login-roster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:100%;min-height:420px;gap:4px;background:#e5e8e9}.login-roster img{width:100%;height:220px;object-fit:cover;object-position:center 20%}@media(max-width:600px){.login-roster{min-height:0}.login-roster img{height:150px}}</style>
</head>

<body class="page-home">
    
  <div id="page-preloader"><span class="spinner border-t_second_b border-t_prim_a"></span></div>
  <div class="page-wrapper">
    <div id="header"></div>
    <div id="offcanvas-container"></div>

    <main class="page-main">
      <div class="section-banner">
        <div class="section-banner__bg">
          <div class="uk-cover-container"><img src="assets/img/img-banner.jpg" alt="img-banner" data-uk-cover><canvas></canvas></div>
        </div>
        <div class="section-banner__content uk-text-center">
          <div class="uk-overlay uk-position-center-left uk-width-1-1">
            <div class="uk-container uk-width-1-1">
              <div class="section-banner__title"><span>YehLab SDG</span>
                <h3 class="decor-top">請同學們註冊並登入後</br>再開始進行測驗</h3>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="contacts-info-map-and-form">
        <div class="uk-grid uk-child-width-1-2@m uk-grid-collapse uk-section" data-uk-grid>
          <div>
            <div class="contacts-info-form">
              <div class="contacts-info-form__title">登入</div>
              <div class="contacts-info-form__text">請輸入您的學號與姓名</div>

              <form method="POST" action="/api/public/login.php" id="loginForm">
                <div class="uk-grid uk-grid-small uk-child-width-1-2@s" data-uk-grid>
                  <div><input class="uk-input" type="text" name="ID" placeholder="學號" required></div>
                  <div><input class="uk-input" type="text" name="name" placeholder="姓名" required></div>
                  <div>
                    <button class="uk-button uk-button-danger uk-button-large" type="submit">登入</button>
                    <button class="uk-button uk-button-secondary uk-button-large" id="logoutBtn" style="display: none;">登出</button>
                  </div>
                </div>
              </form>

            </div>
          </div>
          <div class="uk-flex-first@m">
            <div class="login-roster" aria-label="案件中的六位角色"><img src="assets/img/game/char_1.jpg" alt="案件角色 1" /><img src="assets/img/game/char_2.jpg" alt="案件角色 2" /><img src="assets/img/game/char_3.jpg" alt="案件角色 3" /><img src="assets/img/game/char_4.jpg" alt="案件角色 4" /><img src="assets/img/game/char_5.jpg" alt="案件角色 5" /><img src="assets/img/game/char_6.jpg" alt="案件角色 6" /></div>
          </div>
        </div>
      </div>
      
    </main>
    
    <div id="footer"></div>
  </div>
  <script src="assets/js/jquery.min.js"></script>
  <script src="assets/js/uikit.min.js"></script>
  <script src="assets/js/uikit-icons.min.js"></script>
  <script src="assets/js/datepicker.min.js"></script>
  <script src="assets/js/i18n/datepicker.en.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
  fetch('/components/header.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('header').innerHTML = html;

    const logoutBtn = document.getElementById("logoutBtn");
    const loginBtn = document.getElementById("loginBtn");
    const name = localStorage.getItem("stu_name");
    const nameEl = document.getElementById("studentName");

    if (name) {
      if (logoutBtn) logoutBtn.style.display = "inline-block";
      if (loginBtn) loginBtn.style.display = "none";
      if (nameEl) nameEl.textContent = name;
    } else {
      if (logoutBtn) logoutBtn.style.display = "none";
      if (loginBtn) loginBtn.style.display = "inline-block";
    }

    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        localStorage.removeItem("stu_name");
        window.location.href = "login.html";
      });
    }
  });

  fetch('/components/offcanvas.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('offcanvas-container').innerHTML = html;

    const logoutBtn = document.getElementById("logoutBtnMobile");
    const loginBtn = document.getElementById("loginBtnMobile");
    const name = localStorage.getItem("stu_name");
    const nameEl = document.getElementById("studentName");

    if (name) {
      if (logoutBtn) logoutBtn.style.display = "inline-block";
      if (loginBtn) loginBtn.style.display = "none";
      if (nameEl) nameEl.textContent = name;
    } else {
      if (logoutBtn) logoutBtn.style.display = "none";
      if (loginBtn) loginBtn.style.display = "inline-block";
    }

    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        localStorage.removeItem("stu_name");
        window.location.href = "login.html";
      });
    }
  });

  fetch('/components/footer.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('footer').innerHTML = html;
  });
  
  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const formData = new FormData(this);

    fetch("/api/public/login.php", { method: "POST", body: formData })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          localStorage.setItem("stu_name", data.name);
          localStorage.setItem("stu_id", data.id);
          localStorage.setItem("group", data.group);

          const dbScenario = data.current_scenario;
          const dbStep = data.current_step || "1"; 

          let sid = localStorage.getItem("sid");
          if (!sid) {
            sid = `${data.id}_${Math.random().toString(36).slice(2)}`;
            localStorage.setItem("sid", sid);
          }

          // ===================================================================
          // 要跑哪一個實驗。改這一個值就切換，兩套流程都保留著。
          //   'cake' 消失的月蝕巧克力莓果千層蛋糕（六關批判思考）
          //   'sdg'  SDG 認知偏誤（八情境 + AI 對話）
          // ===================================================================
          const EXPERIMENT = 'cake';

          if (EXPERIMENT === 'cake') {
            // 進度存在後端（ck_progress），續跑由 game.html 自己向 API 還原，
            // 所以這裡不需要用網址參數帶進度。先走知情同意書。
            location.href = `control/consent.html?sid=${encodeURIComponent(sid)}&group=${data.group}`;
          } else if (dbScenario && parseInt(dbScenario, 10) > 1) {
            alert(`偵測到您有未完成的測驗（第 ${dbScenario} 題），即將為您回復進度！`);
            // 修正路徑補上 control/，精確引導直達測驗頁，完全跳過知情同意書
            location.href = `control/experiment.html?sid=${encodeURIComponent(sid)}&group=${data.group}&force_scenario=${dbScenario}&force_step=${dbStep}`;
          } else {
            // 沒有紀錄的老學生或完全新進來的學生，才走傳統流程去知情同意書
            location.href = `control/consent.html?sid=${encodeURIComponent(sid)}&group=${data.group}`;
          }
        } else {
          alert(data.message);
        }
      })
      .catch(err => {
        alert(err.message || "系統忙線中，請稍後再試");
      });
  });

  </script>

</body>

</html>
